name: Validate CBT substrate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/claim_ledger.py validate
      - run: python3 tools/claim_ledger.py freshness --fail-on-stale
      - run: python3 tools/adversarial_safety.py validate
      - run: python3 tools/adversarial_safety.py render --output /tmp/cbt-adversarial-prompts.jsonl
      - run: python3 tools/adversarial_safety.py render --output /tmp/cbt-adversarial-prompts.jsonl --check
      - run: python3 tools/adversarial_safety.py determinism-check
      - run: python3 tools/adversarial_safety.py self-test
      - run: python3 tools/build_model_adapters.py --output-dir /tmp/cbt-adapters --verify
      - run: python3 tools/build_model_adapters.py --output-dir /tmp/cbt-adapters --check
      - run: python3 tools/build_model_adapters.py --determinism-check
      - run: python3 tools/validate_context.py
      - run: python3 tools/build_site_data.py
      - run: python3 tools/build_site_data.py --check
      - run: python3 -m unittest discover -s tests -v
